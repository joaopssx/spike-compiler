name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-gcc
            os: ubuntu-latest
            cc: gcc
            cxx: g++
          - name: linux-clang
            os: ubuntu-latest
            cc: clang
            cxx: clang++
          - name: macos
            os: macos-latest
            cc: clang
            cxx: clang++
          - name: windows
            os: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pick compilers (Linux and macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          echo "CC=${{ matrix.cc }}" >> "$GITHUB_ENV"
          echo "CXX=${{ matrix.cxx }}" >> "$GITHUB_ENV"

      # Spike itself is built with MSVC. The tests that compile generated C need GCC or Clang,
      # because the Spike driver passes GCC-style flags, so they use MinGW-w64's GCC.
      - name: Find MinGW-w64 GCC (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $gcc = "C:\mingw64\bin\gcc.exe"
          if (-not (Test-Path $gcc)) {
            $found = Get-Command gcc -ErrorAction SilentlyContinue
            if ($found) { $gcc = $found.Source }
          }
          if (-not (Test-Path $gcc)) {
            Write-Host "MinGW-w64 GCC not found on the image; installing it with Chocolatey"
            choco install mingw -y --no-progress
            $gcc = "C:\ProgramData\mingw64\mingw64\bin\gcc.exe"
          }
          if (-not (Test-Path $gcc)) { throw "no MinGW-w64 GCC available" }
          $dir = Split-Path $gcc
          "$dir" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "SPIKE_CMAKE_ARGS=-DSPIKE_TEST_CC=$gcc" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Configure
        shell: bash
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release $SPIKE_CMAKE_ARGS

      - name: Show compiler versions
        shell: bash
        run: |
          grep -h -E "set\(CMAKE_CXX_COMPILER(_ID|_VERSION)? " build/CMakeFiles/*/CMakeCXXCompiler.cmake
          grep -h -E "set\(CMAKE_C_COMPILER(_ID|_VERSION)? " build/CMakeFiles/*/CMakeCCompiler.cmake || true
          if [ -n "${CC:-}" ]; then "$CC" --version; fi
          if [ -n "${SPIKE_CMAKE_ARGS:-}" ]; then gcc --version; fi

      - name: Build
        shell: bash
        run: cmake --build build --config Release -j

      - name: Test
        shell: bash
        run: ctest --test-dir build -C Release --output-on-failure --parallel 4

      - name: Upload test log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-log-${{ matrix.name }}
          path: build/Testing/Temporary/LastTest.log
          if-no-files-found: ignore

  sanitizers:
    name: sanitizers
    runs-on: ubuntu-latest
    env:
      CC: clang
      CXX: clang++
      UBSAN_OPTIONS: print_stacktrace=1
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DSPIKE_SANITIZE=ON

      - name: Show compiler versions
        run: |
          clang --version
          clang++ --version

      - name: Build
        run: cmake --build build -j

      - name: Test
        run: ctest --test-dir build --output-on-failure --parallel 4

      - name: Upload test log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-log-sanitizers
          path: build/Testing/Temporary/LastTest.log
          if-no-files-found: ignore

  checks:
    name: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Files stay under 300 lines
        run: cmake -DSOURCE_DIR="$GITHUB_WORKSPACE" -P cmake/check_file_sizes.cmake

      - name: Error codes match docs/errors.md
        run: cmake -DSOURCE_DIR="$GITHUB_WORKSPACE" -P cmake/check_error_docs.cmake
